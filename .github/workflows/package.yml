name: package

on:
  push:
    branches: [main, wasm-simd128]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: opam / ${{ matrix.os }} / OCaml ${{ matrix.ocaml }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        ocaml: ["5.1", "5.2", "5.3", "5.4", "5.5"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Allow opam's sandbox namespaces on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo install -m 644 .github/opam.apparmor /etc/apparmor.d/rake-opam-ci
          sudo apparmor_parser --replace /etc/apparmor.d/rake-opam-ci
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-disable-sandboxing: false
          cache-prefix: v3-070-userns
      - name: Check the package sandbox configuration
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for action in build install remove; do
            opam option --global "wrap-$action-commands" | grep -F sandbox
          done
          opam exec -- bash "$OPAMROOT/opam-init/hooks/sandbox.sh" build true
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam lint rake.opam
      - name: Install with the package's declared tests and documentation
        env:
          RAKE_X86_AS: /nonexistent-rake-assembler
          RAKE_X86_OBJDUMP: /nonexistent-rake-disassembler
          RAKE_AARCH64_AS: /nonexistent-rake-assembler
          RAKE_AARCH64_OBJDUMP: /nonexistent-rake-disassembler
          RAKE_WASM_CC: /nonexistent-rake-compiler
          RAKE_WASM_OBJDUMP: /nonexistent-rake-disassembler
        run: opam install . --with-test --with-doc
      - run: opam exec -- rakec --version

  lower-bounds:
    name: opam / minimum dependencies / OCaml ${{ matrix.ocaml }}
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["5.1", "5.2", "5.3", "5.4", "5.5"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPAMCRITERIA: "+removed,+count[version-lag,solution]"
      OPAMFIXUPCRITERIA: "+removed,+count[version-lag,solution]"
      OPAMUPGRADECRITERIA: "+removed,+count[version-lag,solution]"
      OPAMPRECISETRACKING: "1"
      OPAMERRLOGLEN: "0"
      RAKE_X86_AS: /nonexistent-rake-assembler
      RAKE_X86_OBJDUMP: /nonexistent-rake-disassembler
      RAKE_AARCH64_AS: /nonexistent-rake-assembler
      RAKE_AARCH64_OBJDUMP: /nonexistent-rake-disassembler
      RAKE_WASM_CC: /nonexistent-rake-compiler
      RAKE_WASM_OBJDUMP: /nonexistent-rake-disassembler
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Allow opam's sandbox namespaces on Ubuntu
        run: |
          sudo install -m 644 .github/opam.apparmor /etc/apparmor.d/rake-opam-ci
          sudo apparmor_parser --replace /etc/apparmor.d/rake-opam-ci
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-disable-sandboxing: false
          cache: false
      - name: Check the package sandbox configuration
        run: |
          for action in build install remove; do
            opam option --global "wrap-$action-commands" | grep -F sandbox
          done
          opam exec -- bash "$OPAMROOT/opam-init/hooks/sandbox.sh" build true
      - name: Install the oldest compatible dependency solution
        run: opam install . --solver=builtin-0install --with-test --with-doc
      - run: opam list --installed
      - run: opam exec -- rakec --version

  objects:
    name: GNU ELF and WebAssembly object integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Allow opam's sandbox namespaces on Ubuntu
        run: |
          sudo install -m 644 .github/opam.apparmor /etc/apparmor.d/rake-opam-ci
          sudo apparmor_parser --replace /etc/apparmor.d/rake-opam-ci
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: "5.4"
          opam-disable-sandboxing: false
          cache-prefix: v3-070-userns
      - name: Check the package sandbox configuration
        run: |
          for action in build install remove; do
            opam option --global "wrap-$action-commands" | grep -F sandbox
          done
          opam exec -- bash "$OPAMROOT/opam-init/hooks/sandbox.sh" build true
      - run: sudo apt-get update && sudo apt-get install -y binutils binutils-aarch64-linux-gnu clang llvm
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @runtest-native @runtest-wasm

  cpu-runtime:
    name: SSE2, AVX2, AVX-512, NEON and WebAssembly runtime oracles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RAKE_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rakelang/tree-sitter-rake
          ref: 4c3c350e2a65171090d5d0ff32e9b86144646a9d # 0.7.0 grammar
          path: .grammar
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: false
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Allow the flake-pinned AVX-512 emulator to attach to its tests
        run: sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Run the canonical compiler gate with the locked toolchain
        shell: bash
        run: |
          export TREE_SITTER_RAKE_DIR="$PWD/.grammar"
          nix develop --command bash tools/release_gate.sh --compiler-only

  grammar:
    name: Compiler and Tree-sitter grammar agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rakelang/tree-sitter-rake
          ref: 4c3c350e2a65171090d5d0ff32e9b86144646a9d # 0.7.0 grammar
          path: .grammar
      - name: Allow opam's sandbox namespaces on Ubuntu
        run: |
          sudo install -m 644 .github/opam.apparmor /etc/apparmor.d/rake-opam-ci
          sudo apparmor_parser --replace /etc/apparmor.d/rake-opam-ci
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7
        with:
          ocaml-compiler: "5.4"
          opam-disable-sandboxing: false
          cache-prefix: v3-070-userns
      - name: Check the package sandbox configuration
        run: |
          for action in build install remove; do
            opam option --global "wrap-$action-commands" | grep -F sandbox
          done
          opam exec -- bash "$OPAMROOT/opam-init/hooks/sandbox.sh" build true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: opam install . --with-test
      - run: npm ci --prefix .grammar
      - run: npm test --prefix .grammar
      - name: Compare both parsers on the compiler fixtures
        run: |
          RAKEC="$(opam exec -- which rakec)"
          export RAKEC
          export TREE_SITTER_RAKE_DIR="$PWD/.grammar"
          export TREE_SITTER_BIN="$PWD/.grammar/node_modules/.bin/tree-sitter"
          bash test/parser_differential.sh
